    <script>
      // Resolve the theme before first paint: stored choice wins, otherwise the OS decides.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* no storage: fall through to prefers-color-scheme */ }
      })();
    </script>
